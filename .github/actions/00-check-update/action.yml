name: 'Check Upstream Updates'
description: 'Checks for new releases on selected root implementations (KernelSU / KernelSU-Next)'

inputs:
  root-methods:
    description: 'JSON matrix string containing root methods to check'
    required: true

outputs:
  should-build:
    description: 'Returns true if an update is available for any selected root method'
    value: ${{ steps.check-step.outputs.should-build }}

runs:
  using: "composite"
  steps:
    - name: Check Upstream Repositories
      id: check-step
      shell: bash
      env:
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
      run: |
        RAW_INPUT='${{ inputs.root-methods }}'
        
        METHODS=$(echo "$RAW_INPUT" | jq -r '.root_method[] 2>/dev/null || echo "kernelsu"')

        SHOULD_BUILD=false

        for METHOD in $METHODS; do
          echo "=========================================="
          echo "Checking upstream for target: $METHOD"
          
          if [ "$METHOD" == "kernelsu" ]; then
            UPSTREAM_REPO="tiann/KernelSU"
          elif [ "$METHOD" == "kernelsu-next" ]; then
            UPSTREAM_REPO="KernelSU-Next/KernelSU-Next"
          else
            echo "Unknown method: $METHOD, skipping..."
            continue
          fi

          UPSTREAM_TAG=$(curl -sH "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$UPSTREAM_REPO/releases/latest" | jq -r '.tag_name')

          LOCAL_TAG=$(gh release list --limit 20 2>/dev/null | grep -i "$METHOD" | head -n 1 | awk '{print $1}')

          echo "Upstream Tag ($UPSTREAM_REPO): ${UPSTREAM_TAG:-Not Found}"
          echo "Local Tag ($METHOD): ${LOCAL_TAG:-None}"

          if [ -z "$UPSTREAM_TAG" ] || [ "$UPSTREAM_TAG" == "null" ]; then
            echo "WARNING: Couldn't fetch upstream tag for $UPSTREAM_REPO. Skipping comparison."
            continue
          fi

          if [ "$UPSTREAM_TAG" != "$LOCAL_TAG" ]; then
            echo "==> UPDATE FOUND for $METHOD! Local ($LOCAL_TAG) != Upstream ($UPSTREAM_TAG)"
            SHOULD_BUILD=true
          else
            echo "==> $METHOD is up-to-date."
          fi
        done

        echo "should-build=$SHOULD_BUILD" >> $GITHUB_OUTPUT
